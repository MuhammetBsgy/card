<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .card {
            max-width: 300px;
            min-height: auto;
            margin: auto;
            border: 3px solid yellow;
            padding: 10px;
        }

        .card img {
            width: 300px;
        }

        .card h1 {
            font-family: sans-serif;
            display:table-cell;
            font-size: 25px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .card span {
            font-family: sans-serif;
        }

        .card button {
            background-color: rgb(255, 255, 0);
            border: none;
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 15px;
            display: flex;
            margin: auto;
            padding-inline-start:50px;
            padding-inline-end: 50px;
            padding-top: 10px;
            padding-bottom: 10px;
        }
        
        .card button:hover {
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="card">
        <img src="images/Nike-Adapt-BB-Discontinued.jpg.webp" alt="">
        <h1>Nike Self-Tying Sneakers</h1>
        <span>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolores incidunt eos illum quo vero aut sequi consequuntur? Numquam, possimus natus ratione, cum animi vel impedit dicta iste sit eligendi aliquid!</span>
        <br>
        <br>
        <button>Sepete Ekle</button>
    </div>

</body>

</html>
