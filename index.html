<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

    body {
        background-color: rgba(0, 0, 0, 0.904);
    }

    #card {
        background-color: rgba(128, 128, 128, 0.121);
        max-width: 300px;
        min-height: 100px;
        margin: auto;
        color: white;
        font-family: sans-serif;
        text-align: center;
        padding: 16px;
    }

    #card img {
        width: 100px;
        height: 100px;
        margin: auto;
        border-radius: 50px;
        display: block;
    }

    #isim {
        display: block;
        margin-top: 16px;
    }

    #adres {
        color: rgb(215, 208, 16);
        margin-top: 8px;
        display: block;
        font-size:small;
    }

    #slogan {
        color: rgba(255, 255, 255, 0.722);
        margin-top: 15px;
        display: block;
        font-size: x-small;
    }

    #card a {
        all: unset;
        display: block;
        margin: 8px;
        background-color: rgba(240, 248, 255, 0.113);
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
    }

</style>
</head>
<body>
    <div id="card">
        <img src="images/zaferayan.jpg" alt=""> 
        <span id="isim">Zafer AYAN</span>
        <span id="adres">İstanbul , Türkiye</span>
        <span id="slogan">"Frontend & Mobile App Developer"</span>
        <a href="">Github</a>
        <a href="">Instagram</a>
        <a href="">Linkedln</a>
        <a href="">Facebook</a>
        <a href="">Medıum</a>
    </div>
</body>
</html>
