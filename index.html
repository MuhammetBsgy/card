<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .container{
            background-color: tomato;
            width: 500px;
            height: 500px;
            display: flex;
            flex-direction: column-reverse;
            align-items: end;
        }

        .box{
            background-color: dodgerblue;
            width: 100px;
            height: 100px;
            border: 1px solid blue;
            border-radius: 8px;
        }

    </style>

</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
