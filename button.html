<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buton Yapımı</title>

    <style>

        button.Gönder {
            background-color: dodgerblue;
            margin: auto;
            padding: 8px;
            padding-inline: 16px;
            color: white;
            border-radius: 8px;
            border: 3px solid blue;
        }

        button.Gönder:hover {
            background-color: pink;
            color: brown;
            cursor: pointer;
        }

        button.Sil {
            background-color: red;
            color: white;
            font-family: sans-serif;
            border-radius: 2px;
            border: 0px;
            padding-inline: 30px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        button.Sil:hover {
            cursor: pointer;
            background-color:darkmagenta;
        }

        button.Başarılı {
            background-color: turquoise;
            border: 0px;
            color: white;
            padding-inline: 30px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        button.Başarılı:hover {
            cursor: pointer;
        }

    </style>

</head>

<body>
        
    <button class="Gönder">Gönder</button>
    <button class="Sil">Delete</button>
    <button class="Başarılı">Başarılı</button>

</body>

</html>
